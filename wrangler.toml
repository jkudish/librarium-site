name = "librarium-site"
account_id = "89d91856a820628804e70d3df988cbc5"
compatibility_date = "2026-06-12"

# Assets-only Worker: no main script, just the static Astro build.
[assets]
directory = "./dist"

[[routes]]
pattern = "librarium.si"
custom_domain = true

# Retired host. Kept attached so its proxied DNS record survives deploys; a
# Single Redirect rule on the agentsy.build zone (which runs before Workers)
# answers every request with a 301 to the same path on librarium.si.
[[routes]]
pattern = "librarium.agentsy.build"
custom_domain = true

[observability]
enabled = true
